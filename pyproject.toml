[project]
name = "research-corpus"
version = "0.1.0"
description = "Private multi-source research corpus queried by Claude Code as an MCP tool"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "structlog>=24.4",
    "youtube-transcript-api>=1.2.4",
    "tenacity>=9.1.4",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "sse-starlette>=3.4.8",
    "watchdog>=6.0.0",
    "gliner>=0.2.28",
    "sentence-transformers>=6.0.0",
    "einops>=0.8.2",
    "sumy>=0.13.0",
    "pyyaml>=6.0.3",
    "mcp[cli]>=2.1.1",
    "feedparser>=6.0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-recording>=0.13.4",
    "respx>=0.23.1",
    "ruff>=0.9",
    "vcrpy>=8.3.0",
    "yt-dlp>=2026.8.19",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; reformatting them obscures what actually changed.
"migrations/versions/*" = ["E501"]
"migrations/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a running Postgres"]
