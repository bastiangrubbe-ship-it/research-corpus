# --- Fifth round, part 2: previously recommended, previously deferred ----------
#
# 162 channels classified `recommend: true` in round four and left out of the seed
# list purely on cost. Handles were verified against the live API in that round; no
# re-resolution was needed here.
#
# Adding a channel to this file does not spend anything — `phase` is the ingestion
# ramp, and these are ordered so the domains this corpus exists for come first:
# AI research/automation by confidence, then entrepreneurship, then personal
# development. Ingest in phase order.
#
# Uncapped these total 58,519 credits (~2 months at the 30,000/month budget). Capping
# the 15 channels over 800 videos at 400 most recent brings it to
