# YouTube channel seed table. Generated by scripts/build_channel_seeds.py, plus a
# hand-appended domain (see seeds/README.md for the ingestion ramp and how to
# regenerate the generated portion).
#
# 169 unique channels across four verified rounds (three from
# build_channel_seeds.py + a fourth reviewing all 425 actual subscriptions),
# deduplicated by handle. Full backfill is ~70,031 credits:
# 2.3 months at the 30,000/month Supadata budget.
#
# domain and authority_tier are meant to be hand-tuned here over time; edit freely.
# Everything else is a point-in-time survey fact from 2026-08-21 (2026-08-23 for the
# fourth round) — re-run build_channel_seeds.py against fresh bronze data for the
# first three rounds rather than hand-editing them; the fourth round has no
# generator yet (see scripts/classify_subscriptions.py) and is hand-appended here.
#
# domain values:
#   ai_automation           AI/no-code tooling and automation content
#   ai_research             AI/ML research, vendor primaries, interviews
#   entrepreneurship        general startup/business content
#   personal_development    health, productivity, communication, self-optimization
#   general                 education/documentary/business content that does not
#                           fit the four analytical domains above, kept anyway on
#                           request rather than dropped as out_of_scope
#
# phase, in ingestion order:
#   research-p1            vendor primaries + interviews + news + engineering practice
#   subscriptions          verified subscriptions, deduped against research-p1/p2
#   automation             the automation/creator-business tier
#   research-p2            the rest of the research tier
#   research-p3-deferred   AWS only — ingest by curated playlist, never by channel

